<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Asset Context portfolio banner</title>
  <desc id="desc">A service ticket beside a compact asset information card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2034"/>
      <stop offset="1" stop-color="#1f5d8c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="30" r="250" fill="#fff" opacity=".04"/>
  <circle cx="1310" cy="330" r="180" fill="#fff" opacity=".035"/>
  <g transform="translate(80 72)">
    <text x="0" y="42" fill="#9bd1f5" font-family="Segoe UI, Arial" font-size="20" font-weight="700" letter-spacing="3">SERVICE DESK INTEGRATION</text>
    <text x="0" y="105" fill="#fff" font-family="Segoe UI, Arial" font-size="58" font-weight="800">Asset Context</text>
    <text x="0" y="151" fill="#d9eaf6" font-family="Segoe UI, Arial" font-size="23">Requester assets directly inside the ticket workflow</text>
    <g transform="translate(0 188)" fill="#fff" font-family="Segoe UI, Arial" font-size="17">
      <rect x="0" y="0" width="126" height="38" rx="19" fill="#fff" opacity=".12"/><text x="23" y="25">JavaScript</text>
      <rect x="140" y="0" width="150" height="38" rx="19" fill="#fff" opacity=".12"/><text x="163" y="25">Freshworks FDK</text>
      <rect x="304" y="0" width="138" height="38" rx="19" fill="#fff" opacity=".12"/><text x="333" y="25">Synthetic data</text>
    </g>
  </g>
  <g transform="translate(900 52)" filter="url(#shadow)">
    <rect width="400" height="256" rx="16" fill="#f8fafc"/>
    <rect x="20" y="20" width="360" height="216" rx="10" fill="#fff" stroke="#e6e8eb"/>
    <text x="34" y="52" fill="#1f2937" font-family="Segoe UI, Arial" font-size="16" font-weight="700">Assets</text>
    <rect x="338" y="35" width="28" height="22" rx="11" fill="#fff" stroke="#e6e8eb"/>
    <text x="348" y="51" fill="#6b7280" font-family="Segoe UI, Arial" font-size="12">2</text>
    <rect x="34" y="72" width="332" height="34" fill="#fafafa"/>
    <text x="44" y="94" fill="#6b7280" font-family="Segoe UI, Arial" font-size="12" font-weight="600">ID</text>
    <text x="142" y="94" fill="#6b7280" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Serial</text>
    <text x="274" y="94" fill="#6b7280" font-family="Segoe UI, Arial" font-size="12" font-weight="600">Warranty</text>
    <g font-family="Segoe UI, Arial" font-size="13" fill="#1d4ed8">
      <text x="44" y="132">NB-1042</text><text x="142" y="132">C02X-7K2L-91QP</text><text x="274" y="132">18.11.2027</text>
      <text x="44" y="177">MON-2217</text><text x="142" y="177">DEMO-48Q2-7Z91</text><text x="274" y="177">02.03.2028</text>
    </g>
    <line x1="34" y1="107" x2="366" y2="107" stroke="#e6e8eb"/>
    <line x1="34" y1="148" x2="366" y2="148" stroke="#f1f3f5"/>
    <line x1="34" y1="193" x2="366" y2="193" stroke="#f1f3f5"/>
  </g>
</svg>
